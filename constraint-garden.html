</head><body><p><a href="method-kits.html">Little Life Moths · free tools</a></p><h1>Constraint Garden</h1><p>Generate bounded creative/project experiments from reusable constraint methods rather than staring into a blank page.</p><div class="card"><label>What are you making / solving?<textarea id="prompt"></textarea></label><label>How many constraints? <select id="count"><option>1</option><option selected>3</option><option>5</option></select></label><button id="grow">Grow constraints</button></div><div class="card"><ol id="list"></ol><button id="exportBtn">Export experiment</button></div><script>const bank=["Remove one element before adding anything new.", "Make two legitimate variants before choosing.", "Use absence or silence as an active design element.", "Limit the first pass to three tools/components.", "Preserve one discarded branch and write why it was discarded.", "Change only one dimension at a time.", "Define one thing the result must not do.", "Make the smallest reversible version first.", "Let one unresolved question remain unresolved.", "Separate what is measured from what is preferred.", "Use a return/repetition, but change its role or context.", "Give the quiet/idle state an explicit meaning instead of treating it as failure."];let current=[];grow.onclick=()=>{let pool=[...bank];current=[];for(let i=0;i<+count.value&&pool.length;i++){let j=Math.floor(Math.random()*pool.length);current.push(pool.splice(j,1)[0])}list.innerHTML='';current.forEach(x=>{let li=document.createElement('li');li.textContent=x;list.appendChild(li)})};exportBtn.onclick=()=>{let o={schema:'constraint-garden.v1',prompt:prompt.value,constraints:current};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='constraint-garden.json';a.click()};grow.click();</script><hr><p><small>Runs entirely in your browser. No input is transmitted or stored by this page. <a href="https://paypal.me/CoreyGould/5USD">Support the work</a>.</small></p></body></html>
