<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacy Topology Planner — Little Life Moths</title><meta name="description" content="Turn a directory sketch into explicit pre-enumeration exclusions, telemetry allowlists and named crossing rules."><style>body{max-width:850px;margin:40px auto;padding:0 20px;font:16px/1.55 system-ui;background:#f4f0e8;color:#111416}.card{background:#fffdf7;border:1px solid #c7bfaf;border-radius:16px;padding:18px;margin:16px 0}button,input,select,textarea{font:inherit;padding:9px}textarea{width:100%;min-height:150px}code,pre{white-space:pre-wrap;word-break:break-word}a{color:#8b4058}</style></head><body><p><a href="method-kits.html">Little Life Moths · free tools</a></p><h1>Privacy Topology Planner</h1><p>Turn a directory sketch into explicit pre-enumeration exclusions, telemetry allowlists and named crossing rules.</p><div class="card"><label>Public/indexable roots<textarea id="publicRoots" placeholder="/app/public\n/docs/public"></textarea></label><label>Private roots<textarea id="privateRoots" placeholder="/app/private\n/customer-work"></textarea></label><label>Telemetry may expose<textarea id="telemetry" placeholder="health status\ncounts\nlast-success timestamp"></textarea></label><label>Explicit crossing destinations<textarea id="crossings" placeholder="public export folder\naudit receipt ledger"></textarea></label><button id="plan">Build boundary plan</button></div><div class="card"><pre id="out"></pre><button id="download">Export rules</button><p><a href="method-privacy-by-topology.html?source=tool-privacy-topology-planner">Full Privacy by Topology Kit</a></p></div><script>
let current={};function lines(x){return x.value.split(/\n/).map(v=>v.trim()).filter(Boolean)}plan.onclick=()=>{let pub=lines(publicRoots),priv=lines(privateRoots),tel=lines(telemetry),cross=lines(crossings);let conflicts=[];priv.forEach(p=>pub.forEach(q=>{if(p===q||p.startsWith(q+'/')||q.startsWith(p+'/'))conflicts.push({private:p,public:q})}));current={schema:'privacy-topology-plan.v1',generated_at:new Date().toISOString(),public_roots:pub,private_roots:priv,exclude_before_enumeration:priv.map(x=>({root:x,rule:'exclude-before-enumeration'})),telemetry_allowlist:tel,explicit_crossing_destinations:cross,crossing_rule:'only named artifacts cross; source private roots remain excluded',conflicts};out.textContent=JSON.stringify(current,null,2)};download.onclick=()=>{plan.click();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'}));a.download='privacy-topology-plan.json';a.click()};plan.click();</script><hr><p><small>Runs entirely in your browser. No input is transmitted or stored by this page. <a href="https://paypal.me/CoreyGould/5USD">Support the work</a>.</small></p></body></html>
