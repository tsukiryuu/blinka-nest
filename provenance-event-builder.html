<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Provenance Event Builder — Little Life Moths</title><meta name="description" content="Build a small attributed event record locally in your browser."><style>body{max-width:850px;margin:40px auto;padding:0 20px;font:16px/1.55 system-ui;background:#f4f0e8;color:#111416}.card{background:#fffdf7;border:1px solid #c7bfaf;border-radius:16px;padding:18px;margin:16px 0}button,input,select,textarea{font:inherit;padding:9px}textarea{width:100%;min-height:150px}code,pre{white-space:pre-wrap;word-break:break-word}a{color:#8b4058}</style></head><body><p><a href="method-kits.html">Little Life Moths · free tools</a></p><h1>Provenance Event Builder</h1><p>Build a small attributed event record locally in your browser.</p><div class="card"><label>Actor <input id="actor" placeholder="worker-a"></label><br><br><label>Action <input id="action" placeholder="state_updated"></label><br><br><label>Source <input id="source" placeholder="ledger/event-123"></label><br><br><label>Confidence <select id="confidence"><option>observed</option><option>inferred</option><option>reported</option><option>unknown</option></select></label><br><br><label>Note<textarea id="note" placeholder="What changed, and what remains uncertain?"></textarea></label><br><button id="make">Build event</button></div><div class="card"><pre id="out"></pre><button id="download">Download JSON</button><p><a href="method-agent-provenance-ledger.html">Full Provenance & Handoff Ledger Kit</a></p></div><script>function eventObj(){return {event_id:crypto.randomUUID(),ts:new Date().toISOString(),actor:actor.value||null,action:action.value||null,source:source.value||null,confidence:confidence.value,note:note.value||null}}let current={};make.onclick=()=>{current=eventObj();out.textContent=JSON.stringify(current,null,2)};download.onclick=()=>{if(!current.event_id)make.click();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'}));a.download='provenance-event.json';a.click()};make.click();</script><hr><p><small>Runs entirely in your browser. No input is transmitted or stored by this page. <a href="https://paypal.me/CoreyGould/5USD">Support the work</a>.</small></p></body></html>
