<!doctype html><html lang="en" class="nest-unified"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Provenance Event Builder — Little Life Moths</title><meta name="description" content="Build and export a local append-only provenance chain with explicit prior-event linkage."><style>body{max-width:850px;margin:40px auto;padding:0 20px;font:16px/1.55 system-ui;background:#f4f0e8;color:#111416}.card{background:#fffdf7;border:1px solid #c7bfaf;border-radius:16px;padding:18px;margin:16px 0}button,input,select,textarea{font:inherit;padding:9px}textarea{width:100%;min-height:150px}code,pre{white-space:pre-wrap;word-break:break-word}a{color:#8b4058}</style><link rel="stylesheet" href="nest-shell.css">
<script defer src="nest-shell.js"></script>
</head><body><p><a href="method-kits.html">Little Life Moths · free tools</a></p><h1>Provenance Event Builder</h1><p>Build and export a local append-only provenance chain with explicit prior-event linkage.</p><div class="card"><label>Actor <input id="actor" placeholder="worker-a"></label><br><br><label>Action <input id="action" placeholder="state_updated"></label><br><br><label>Source <input id="source" placeholder="ledger/event-123"></label><br><br><label>Confidence <select id="confidence"><option>observed</option><option>inferred</option><option>reported</option><option>unknown</option></select></label><br><br><label>Note<textarea id="note" placeholder="What changed, and what remains uncertain?"></textarea></label><br><button id="append">Append event</button> <button id="reset">Reset local chain</button></div><div class="card"><pre id="out"></pre><button id="download">Export JSONL chain</button><p><a href="method-agent-provenance-ledger.html?source=tool-provenance-event-builder">Full Provenance & Handoff Ledger Kit</a></p></div><script>
let chain=[];function hex(n){return n.toString(16).padStart(8,'0')}function cheapHash(s){let a=0x811c9dc5,b=0x9e3779b9;for(let i=0;i<s.length;i++){a=Math.imul(a^s.charCodeAt(i),16777619);b=Math.imul(b+(s.charCodeAt(i)^i),2246822519)}return hex(a>>>0)+hex(b>>>0)}function render(){out.textContent=chain.map(x=>JSON.stringify(x)).join('\n')||'No events yet.'}
append.onclick=()=>{let prev=chain.length?chain[chain.length-1].event_hash:null;let base={event_id:crypto.randomUUID(),ts:new Date().toISOString(),actor:actor.value||null,action:action.value||null,source:source.value||null,confidence:confidence.value,note:note.value||null,previous_event_hash:prev};base.event_hash=cheapHash(JSON.stringify(base));chain.push(base);render()};reset.onclick=()=>{chain=[];render()};download.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([chain.map(x=>JSON.stringify(x)).join('\n')+'\n'],{type:'application/x-ndjson'}));a.download='provenance-chain.jsonl';a.click()};append.click();</script><hr><p><small>Runs entirely in your browser. No input is transmitted or stored by this page. <a href="https://paypal.me/CoreyGould/5USD">Support the work</a>.</small></p></body></html>
